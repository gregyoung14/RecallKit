name: RecallKit
options:
  createIntermediateGroups: true
packages:
  RecallKit:
    path: ../..
targets:
  RecallKitApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.RecallKitBenchmarkApp
        PRODUCT_MODULE_NAME: RecallKitApp
        PRODUCT_NAME: RecallKit
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: 6.0
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: RecallKit
        product: RecallKit